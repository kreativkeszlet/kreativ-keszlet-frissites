name: Kreativ Keszlet Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v36.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: V36 ZIP kicsomagolása
        shell: powershell
        run: |
          Remove-Item -Recurse -Force app -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path app | Out-Null
          Expand-Archive -Path "KreativKeszlet_V36_2_AUTOFRISSITES_FIX.zip" -DestinationPath app

     
      - name: Windows program elkészítése
        shell: powershell
        run: |
          $build = Get-ChildItem -Path app -Filter "build_windows.bat" -Recurse | Select-Object -First 1
          if (-not $build) { throw "build_windows.bat nem található" }
          Set-Location $build.DirectoryName
          cmd /c $build.FullName

      - name: Windows ZIP elkészítése
        shell: powershell
        run: |
          $dist = Get-ChildItem -Path app -Directory -Filter "dist" -Recurse | Select-Object -First 1
          if (-not $dist) { throw "dist mappa nem található" }
          Compress-Archive `
            -Path "$($dist.FullName)\*" `
            -DestinationPath "KreativKeszlet-Windows.zip" `
            -Force

      - name: Windows ZIP feltöltése a Release-hez
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) {
            $tag = "${{ inputs.tag }}"
          }

          gh release upload $tag `
            "KreativKeszlet-Windows.zip" `
            --clobber
